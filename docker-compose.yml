# Chỉ chạy model local. AIService chạy bằng Uvicorn trong terminal trên host.
services:
  # ---------- Ollama (LLM local) ----------
  ollama:
    image: ollama/ollama
    container_name: rental-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Giữ model trong bộ nhớ để request đầu tiên không bị timeout.
      - OLLAMA_KEEP_ALIVE=24h
      # Một lượt suy luận mỗi lần để hạn chế VRAM trên RTX 3050 4 GB.
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rental-network

volumes:
  ollama_data:

networks:
  rental-network:
    driver: bridge
